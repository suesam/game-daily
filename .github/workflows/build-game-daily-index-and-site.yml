name: Build Game Daily Index and Site

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Import Game Daily from Gmail"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: game-daily-index-and-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate README, indexes and website
        run: |
          python <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from html import escape
          import re

          REPORT_RE = re.compile(r"^\d{4}-\d{2}-\d{2}\.md$")
          reports = []

          for path in sorted(Path("reports").glob("????/??/*.md"), reverse=True):
              if not REPORT_RE.fullmatch(path.name):
                  continue

              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              title = (
                  lines[0].removeprefix("# ").strip()
                  if lines
                  else path.stem
              )

              reports.append(
                  {
                      "path": path,
                      "date": path.stem,
                      "title": title,
                      "text": text,
                  }
              )

          if not reports:
              raise RuntimeError("No formal reports found under reports/YYYY/MM/")

          by_month = defaultdict(list)
          for item in reports:
              by_month[item["date"][:7]].append(item)

          latest = reports[0]

          # 修正最初误建的 READMW.md。
          typo = Path("READMW.md")
          if typo.exists():
              typo.unlink()

          # ---------- README.md ----------
          readme = [
              "# AI 游戏每日简报",
              "",
              "由 ChatGPT 定时任务生成，经 Gmail 投递后由 GitHub Actions 自动归档。",
              "",
              "## 最新一期",
              "",
              f"- [{latest['title']}]({latest['path'].as_posix()})",
              "",
              "## 最近 10 期",
              "",
          ]

          for item in reports[:10]:
              readme.append(
                  f"- [{item['date']}｜{item['title']}]"
                  f"({item['path'].as_posix()})"
              )

          readme += [
              "",
              "## 按月归档",
              "",
          ]

          for month in sorted(by_month, reverse=True):
              year, mm = month.split("-")
              readme.append(
                  f"- [{month}](reports/{year}/{mm}/README.md)"
                  f" — {len(by_month[month])} 期"
              )

          readme += [
              "",
              "## 浏览",
              "",
              "- [全部日报索引](reports/INDEX.md)",
              "- [网页版日报](https://suesam.github.io/game-daily/)",
              "",
              "> README、索引和网站由 GitHub Actions 自动维护。",
              "",
          ]

          Path("README.md").write_text(
              "\n".join(readme),
              encoding="utf-8",
          )

          # ---------- reports/INDEX.md ----------
          index = [
              "# 全部 AI 游戏每日简报",
              "",
          ]

          for month in sorted(by_month, reverse=True):
              index += [
                  f"## {month}",
                  "",
              ]

              for item in by_month[month]:
                  rel = item["path"].relative_to("reports").as_posix()
                  index.append(
                      f"- [{item['date']}｜{item['title']}]({rel})"
                  )

              index.append("")

          Path("reports/INDEX.md").write_text(
              "\n".join(index),
              encoding="utf-8",
          )

          # ---------- 月度 README ----------
          for month, items in by_month.items():
              year, mm = month.split("-")
              month_dir = Path("reports") / year / mm

              lines = [
                  f"# {month} AI 游戏每日简报",
                  "",
                  "[返回全部索引](../../INDEX.md)",
                  "",
              ]

              for item in items:
                  lines.append(
                      f"- [{item['date']}｜{item['title']}]"
                      f"({item['path'].name})"
                  )

              lines.append("")

              (month_dir / "README.md").write_text(
                  "\n".join(lines),
                  encoding="utf-8",
              )

          # ---------- 静态网站 ----------
          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          (docs / ".nojekyll").write_text("", encoding="utf-8")

          css = """
          :root { color-scheme: light dark; }
          * { box-sizing: border-box; }
          body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            max-width: 920px;
            margin: 0 auto;
            padding: 32px 20px 80px;
            line-height: 1.75;
          }
          a { text-decoration: none; }
          a:hover { text-decoration: underline; }
          .hero { margin-bottom: 34px; }
          .muted { opacity: .68; }
          .card {
            border: 1px solid rgba(127,127,127,.28);
            border-radius: 14px;
            padding: 18px;
            margin: 12px 0;
          }
          .date { font-size: .9rem; opacity: .65; margin-bottom: 4px; }
          nav { margin: 20px 0 32px; }
          blockquote {
            border-left: 4px solid rgba(127,127,127,.45);
            margin-left: 0;
            padding-left: 16px;
          }
          code {
            padding: 2px 5px;
            border-radius: 5px;
            background: rgba(127,127,127,.12);
          }
          hr {
            border: 0;
            border-top: 1px solid rgba(127,127,127,.25);
            margin: 28px 0;
          }
          img { max-width: 100%; }
          """

          cards = []

          for item in reports:
              y, m, _ = item["date"].split("-")
              href = f"reports/{y}/{m}/{item['date']}.html"

              cards.append(
                  '<article class="card">'
                  f'<div class="date">{escape(item["date"])}</div>'
                  f'<a href="{href}"><strong>'
                  f'{escape(item["title"])}</strong></a>'
                  "</article>"
              )

          latest_y, latest_m, _ = latest["date"].split("-")
          latest_href = (
              f"reports/{latest_y}/{latest_m}/{latest['date']}.html"
          )

          home = f"""<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="description" content="AI 游戏每日趋势与行业信号归档">
            <title>AI 游戏每日简报</title>
            <style>{css}</style>
          </head>
          <body>
            <header class="hero">
              <h1>AI 游戏每日简报</h1>
              <p class="muted">
                游戏行业、平台热榜、AI 游戏进展、研究与社区信号的每日观察。
              </p>
              <p><a href="{latest_href}">阅读最新一期 →</a></p>
            </header>
            <main>
              <h2>全部日报</h2>
              {''.join(cards)}
            </main>
          </body>
          </html>
          """

          (docs / "index.html").write_text(
              home,
              encoding="utf-8",
          )

          # 单篇网页使用 marked 渲染 Markdown。
          # Markdown 原文先 HTML escape 后放入 textarea，避免直接注入页面。
          for item in reports:
              y, m, _ = item["date"].split("-")
              out = (
                  docs
                  / "reports"
                  / y
                  / m
                  / f"{item['date']}.html"
              )

              out.parent.mkdir(parents=True, exist_ok=True)
              md = escape(item["text"])

              page = f"""<!doctype html>
              <html lang="zh-CN">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>{escape(item["title"])}</title>
                <style>{css}</style>
                <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
              </head>
              <body>
                <nav><a href="../../../index.html">← 返回日报首页</a></nav>
                <main id="content">
                  <pre style="white-space:pre-wrap">{md}</pre>
                </main>
                <textarea id="source" hidden>{md}</textarea>
                <script>
                  if (window.marked) {{
                    document.getElementById("content").innerHTML =
                      marked.parse(document.getElementById("source").value);
                  }}
                </script>
              </body>
              </html>
              """

              out.write_text(
                  page,
                  encoding="utf-8",
              )

          print(
              f"Generated navigation and site for {len(reports)} report(s)."
          )
          PY

      - name: Commit generated navigation
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git config user.name "game-daily-bot"
            git config user.email "game-daily-bot@users.noreply.github.com"
            git commit -m "Refresh Game Daily index and site"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

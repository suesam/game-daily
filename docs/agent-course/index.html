<!doctype html>
<html lang="zh-CN">

<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar" aria-label="课程目录">

  <div class="side-caption">学习空间</div>
  <button class="nav-overview" id="overview-nav" data-action="overview"><span class="tiny-icon">◈</span> 我的学习看板 <span id="overview-dot">↗</span></button>
  <div class="side-section"><span>课程路径</span><span id="side-summary">0/10</span></div>

<main id="main" class="main-content" tabindex="-1"></main>

</div>
</div>
<input id="import-input" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast" aria-live="polite"></div>
